{% extends "base.html" %}

{% block title %}
Add Vehicle | Fleet Management System
{% endblock %}

{% block page_title %}
Add Vehicle
{% endblock %}

{% block content %}

<div class="form-container">

    <div class="card">

        <div class="form-header">

            <div>
                <h2>🚗 Add New Vehicle</h2>

                <p>
                    Enter the vehicle details below.
                </p>
            </div>

        </div>


        <form
            action="{{ url_for('main.add_vehicle') }}"
            method="POST"
        >

            <!-- VEHICLE NUMBER -->

            <div class="form-group">

                <label for="vehicle_number">
                    Vehicle Number
                </label>

                <input
                    type="text"
                    id="vehicle_number"
                    name="vehicle_number"
                    placeholder="Example: KA01AB1234"
                    required
                >

            </div>


            <!-- MODEL -->

            <div class="form-group">

                <label for="model">
                    Vehicle Model
                </label>

                <input
                    type="text"
                    id="model"
                    name="model"
                    placeholder="Example: Tata Nexon"
                    required
                >

            </div>


            <!-- VEHICLE TYPE -->

            <div class="form-group">

                <label for="vehicle_type">
                    Vehicle Type
                </label>

                <select
                    id="vehicle_type"
                    name="vehicle_type"
                    required
                >

                    <option value="">
                        Select Vehicle Type
                    </option>

                    <option value="Car">
                        🚗 Car
                    </option>

                    <option value="Van">
                        🚐 Van
                    </option>

                    <option value="Truck">
                        🚚 Truck
                    </option>

                    <option value="Bus">
                        🚌 Bus
                    </option>

                    <option value="Bike">
                        🏍️ Bike
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- STATUS -->

            <div class="form-group">

                <label for="status">
                    Vehicle Status
                </label>

                <select
                    id="status"
                    name="status"
                    required
                >

                    <option value="Available">
                        Available
                    </option>

                    <option value="On Route">
                        On Route
                    </option>

                    <option value="Maintenance">
                        Maintenance
                    </option>

                    <option value="Inactive">
                        Inactive
                    </option>

                </select>

            </div>


            <!-- LOCATION -->

            <div class="form-group">

                <label for="current_location">
                    Current Location
                </label>

                <input
                    type="text"
                    id="current_location"
                    name="current_location"
                    placeholder="Example: Bengaluru"
                    value="Not Available"
                >

            </div>


            <!-- MILEAGE -->

            <div class="form-group">

                <label for="mileage">
                    Mileage (km)
                </label>

                <input
                    type="number"
                    id="mileage"
                    name="mileage"
                    placeholder="Example: 25000"
                    min="0"
                    step="0.1"
                    value="0"
                >

            </div>


            <!-- BUTTONS -->

            <div class="form-actions">

                <a
                    href="{{ url_for('main.vehicles') }}"
                    class="btn btn-secondary"
                >
                    ← Cancel
                </a>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    + Add Vehicle
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
